name: CI

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify static pages
        run: |
          echo "Checking generated pages..."
          test -f .next/server/app/index.html || (echo "Home page missing" && exit 1)
          test -f .next/server/app/unlock.html || (echo "Unlock page missing" && exit 1)
          test -f .next/server/app/merge.html || (echo "Merge page missing" && exit 1)
          echo "All pages generated successfully"
