<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#obg)"/>

  <!-- Logo -->
  <rect x="520" y="140" width="60" height="60" rx="14" fill="#2563eb"/>
  <rect x="534" y="152" width="32" height="36" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
  <line x1="542" y1="165" x2="558" y2="165" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="542" y1="173" x2="558" y2="173" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <text x="594" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#0f172a">PDF Toolkit</text>
  <text x="790" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#2563eb">Pro</text>

  <!-- Tagline -->
  <text x="600" y="240" font-family="system-ui" font-size="20" fill="#475569" text-anchor="middle">Open-source, privacy-first PDF toolkit</text>
  <text x="600" y="270" font-family="system-ui" font-size="16" fill="#94a3b8" text-anchor="middle">10 tools · 100% browser-based · No server uploads</text>

  <!-- Feature pills -->
  <g transform="translate(200, 310)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="75" y="23" font-family="system-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">🔓 Unlock</text>

    <rect x="166" y="0" width="130" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="231" y="23" font-family="system-ui" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">📋 Merge</text>

    <rect x="312" y="0" width="120" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="372" y="23" font-family="system-ui" font-size="12" font-weight="600" fill="#ea580c" text-anchor="middle">✂️ Split</text>

    <rect x="448" y="0" width="160" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="528" y="23" font-family="system-ui" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">📄 Extract</text>

    <rect x="624" y="0" width="170" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="709" y="23" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">+ 6 more tools</text>
  </g>

  <!-- Stats -->
  <g transform="translate(300, 400)">
    <text x="0" y="0" font-family="system-ui" font-size="36" font-weight="800" fill="#2563eb">104KB</text>
    <text x="0" y="24" font-family="system-ui" font-size="12" fill="#94a3b8">First Load</text>

    <text x="200" y="0" font-family="system-ui" font-size="36" font-weight="800" fill="#0f172a">10</text>
    <text x="200" y="24" font-family="system-ui" font-size="12" fill="#94a3b8">PDF Tools</text>

    <text x="350" y="0" font-family="system-ui" font-size="36" font-weight="800" fill="#0f172a">2</text>
    <text x="350" y="24" font-family="system-ui" font-size="12" fill="#94a3b8">Languages</text>

    <text x="480" y="0" font-family="system-ui" font-size="36" font-weight="800" fill="#16a34a">0</text>
    <text x="480" y="24" font-family="system-ui" font-size="12" fill="#94a3b8">Server Uploads</text>
  </g>

  <!-- GitHub badge -->
  <rect x="475" y="490" width="250" height="40" rx="20" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="516" font-family="system-ui" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">⭐ Star on GitHub · MIT License</text>
</svg>
