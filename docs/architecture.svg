<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#abg)" rx="12"/>
  <text x="400" y="36" font-family="system-ui" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Architecture — 100% Client-Side Processing</text>

  <!-- Browser box -->
  <rect x="40" y="60" width="720" height="300" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="86" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Browser (Your Device)</text>
  <line x1="60" y1="96" x2="740" y2="96" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Next.js -->
  <rect x="70" y="116" width="180" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="160" y="148" font-family="system-ui" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Next.js 16</text>
  <text x="160" y="168" font-family="system-ui" font-size="10" fill="#3b82f6" text-anchor="middle">Static Site (SSG)</text>
  <text x="160" y="182" font-family="system-ui" font-size="10" fill="#3b82f6" text-anchor="middle">Lazy-loaded tools</text>

  <!-- pdf-lib -->
  <rect x="310" y="116" width="180" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="148" font-family="system-ui" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">pdf-lib</text>
  <text x="400" y="168" font-family="system-ui" font-size="10" fill="#16a34a" text-anchor="middle">PDF Processing Engine</text>
  <text x="400" y="182" font-family="system-ui" font-size="10" fill="#16a34a" text-anchor="middle">Lazy-loaded on demand</text>

  <!-- JSZip -->
  <rect x="550" y="116" width="180" height="80" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="148" font-family="system-ui" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">JSZip</text>
  <text x="640" y="168" font-family="system-ui" font-size="10" fill="#ca8a04" text-anchor="middle">ZIP Packaging</text>
  <text x="640" y="182" font-family="system-ui" font-size="10" fill="#ca8a04" text-anchor="middle">For batch downloads</text>

  <!-- Flow arrows -->
  <path d="M160 196 L160 230 L400 230 L400 250" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M640 196 L640 230 L400 230" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#94a3b8"/></marker></defs>

  <!-- Processing box -->
  <rect x="270" y="250" width="260" height="60" rx="10" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="1" stroke-dasharray="4"/>
  <text x="400" y="276" font-family="system-ui" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">All Processing Happens Here</text>
  <text x="400" y="296" font-family="system-ui" font-size="10" fill="#3b82f6" text-anchor="middle">No data leaves your device</text>

  <!-- Server -->
  <rect x="290" y="330" width="220" height="24" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="400" y="347" font-family="system-ui" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">🚫 No Server Communication</text>
</svg>
