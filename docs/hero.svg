<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#2563eb" opacity="0.03"/>
  <circle cx="1180" cy="540" r="250" fill="#7c3aed" opacity="0.03"/>

  <!-- App mockup card -->
  <g filter="url(#shadow)">
    <rect x="180" y="80" width="920" height="480" rx="16" fill="white"/>

    <!-- Header bar -->
    <rect x="180" y="80" width="920" height="56" rx="16" fill="white"/>
    <rect x="180" y="120" width="920" height="16" fill="white"/>
    <line x1="180" y1="136" x2="1100" y2="136" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Logo -->
    <rect x="210" y="96" width="28" height="28" rx="6" fill="#eff6ff"/>
    <text x="248" y="116" font-family="system-ui" font-size="14" font-weight="700" fill="#1e293b">PDF Toolkit</text>
    <text x="346" y="116" font-family="system-ui" font-size="14" font-weight="700" fill="#2563eb">Pro</text>

    <!-- Hero text -->
    <text x="640" y="210" font-family="system-ui" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-1">PDF Toolkit Pro</text>
    <text x="640" y="245" font-family="system-ui" font-size="14" fill="#64748b" text-anchor="middle">All-in-one PDF solution — 100% browser-based, no server upload</text>

    <!-- CTA buttons -->
    <rect x="480" y="265" width="180" height="40" rx="10" fill="url(#blue)"/>
    <text x="570" y="290" font-family="system-ui" font-size="13" font-weight="600" fill="white" text-anchor="middle">Get Started</text>
    <rect x="672" y="265" width="130" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="737" y="290" font-family="system-ui" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">All Tools ↓</text>

    <!-- Tool cards grid -->
    <g transform="translate(220, 330)">
      <!-- Row of tool cards -->
      <rect x="0" y="0" width="200" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#f0fdf4"/>
      <text x="34" y="42" font-size="20" text-anchor="middle">🔓</text>
      <text x="16" y="72" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Unlock PDF</text>
      <text x="16" y="88" font-family="system-ui" font-size="10" fill="#94a3b8">Remove passwords</text>

      <rect x="216" y="0" width="200" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="232" y="16" width="36" height="36" rx="8" fill="#eff6ff"/>
      <text x="250" y="42" font-size="20" text-anchor="middle">📋</text>
      <text x="232" y="72" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Merge PDF</text>
      <text x="232" y="88" font-family="system-ui" font-size="10" fill="#94a3b8">Combine multiple PDFs</text>

      <rect x="432" y="0" width="200" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="448" y="16" width="36" height="36" rx="8" fill="#fff7ed"/>
      <text x="466" y="42" font-size="20" text-anchor="middle">✂️</text>
      <text x="448" y="72" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Split PDF</text>
      <text x="448" y="88" font-family="system-ui" font-size="10" fill="#94a3b8">Divide by page ranges</text>

      <rect x="648" y="0" width="200" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="664" y="16" width="36" height="36" rx="8" fill="#f5f3ff"/>
      <text x="682" y="42" font-size="20" text-anchor="middle">📄</text>
      <text x="664" y="72" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Extract Pages</text>
      <text x="664" y="88" font-family="system-ui" font-size="10" fill="#94a3b8">Pick specific pages</text>
    </g>
  </g>

  <!-- Bottom badge -->
  <rect x="490" y="590" width="300" height="32" rx="16" fill="white" opacity="0.8"/>
  <text x="640" y="611" font-family="system-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">20 Tools · 2 Languages · Lazy Loaded</text>
</svg>
